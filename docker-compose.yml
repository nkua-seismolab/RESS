services:
  ress:
    build: .
    container_name: ress
    network_mode: "host"
    restart: unless-stopped
    env_file:
      - ".env"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # SDS archive: host path must match sds.archive in config.yaml (/data/archive)
      - /my/archive/path:/data/archive:ro

  ress-api:
    build: .
    container_name: ress-api
    network_mode: "host"
    restart: unless-stopped
    env_file:
      - ".env"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["uvicorn", "ress.api.main:app", "--host", "0.0.0.0", "--port", "8070"]

  postgres:
    image: postgres:17.0
    container_name: ress-postgres
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./database/pg_data:/var/lib/postgresql/data
    # published on the host so the host-networked ress/ress-api reach 127.0.0.1:${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT:-5472}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ress} -d ${POSTGRES_DB:-ress}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
